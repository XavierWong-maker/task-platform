[project]
name = "task-platform"
version = "0.1.0"
description = "任务调度与数据处理平台"
requires-python = ">=3.12"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = false
